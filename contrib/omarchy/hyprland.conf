# buckyboi — Omarchy / Hyprland drop-in
#
#   mkdir -p ~/.config/hypr
#   source = ~/src/buckyboi/contrib/omarchy/hyprland.conf
#   # or copy these binds into ~/.config/hypr/hyprland.conf
#
# The overlay is a standalone Rust binary (not a Quickshell plugin).
# Start it once per session:

exec-once = buckyboi

# --- Wake when hidden -------------------------------------------------------
# Wayland has no portable “any key / mouse anywhere” spy. The running
# binary already polls Hyprland IPC `cursorpos`, so moving the mouse is
# enough on Omarchy. Also bind a global hotkey that does not steal focus
# from other windows (it only writes to $XDG_RUNTIME_DIR/buckyboi.sock):

bind = SUPER, B, exec, buckyboi --wake

# Optional: same wake from a different chord
# bind = SUPER SHIFT, B, exec, buckyboi --wake

# --- Quit without overlay keyboard focus ------------------------------------
# Esc works when the layer has OnDemand keyboard focus (after you click
# the buddy). This bind always works:

bind = SUPER, Escape, exec, buckyboi --quit

# --- Layer rules ------------------------------------------------------------
# Namespace is "buckyboi" (zwlr_layer_shell_v1). Keep it un-animated and
# un-blurred so the ARGB wireframe stays sharp.

layerrule = noanim, buckyboi
layerrule = noblur, buckyboi
layerrule = ignorealpha 0.05, buckyboi
