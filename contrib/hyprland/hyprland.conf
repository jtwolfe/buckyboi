# buckyboi — generic Hyprland / wlroots drop-in (same as contrib/omarchy/)
#
#   source = ~/src/buckyboi/contrib/hyprland/hyprland.conf

exec-once = buckyboi

bind = SUPER, B, exec, buckyboi --wake
bind = SUPER, Escape, exec, buckyboi --quit

layerrule = noanim, buckyboi
layerrule = noblur, buckyboi
layerrule = ignorealpha 0.05, buckyboi
