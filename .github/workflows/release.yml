# Tagged release assets (`v*`).
#
# Builds the default-features binary (overlay + webcam gaze). Identity
# backends (`face`, `hands`, `voice`) are optional local rebuilds — they
# pull ONNX Runtime / sherpa-onnx and are not shipped here. ONNX model
# weights are never vendored.
#
# Same billing note as ci.yml: jobs need Actions spending cleared.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package (e.g. v0.5.0). Empty = current SHA, no GitHub Release upload."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxext-dev libxfixes-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-x86_64
          cache-on-failure: true

      - name: resolve version
        id: ver
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$CARGO_VER" ]]; then
              echo "tag $TAG does not match rust/Cargo.toml version $CARGO_VER"
              exit 1
            fi
            UPLOAD=true
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$CARGO_VER" ]]; then
              echo "requested tag $TAG does not match rust/Cargo.toml version $CARGO_VER"
              exit 1
            fi
            UPLOAD=true
          else
            TAG=""
            VERSION="$CARGO_VER"
            UPLOAD=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"
          echo "packaging version=$VERSION upload=$UPLOAD"

      - name: cargo build --release (default features)
        run: cargo build --release --locked --manifest-path rust/Cargo.toml

      - name: tarball + .deb
        run: |
          scripts/package-linux.sh \
            "${{ steps.ver.outputs.version }}" \
            rust/target/release/buckyboi \
            dist

      - name: publish GitHub Release
        if: steps.ver.outputs.upload == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: buckyboi ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/buckyboi-${{ steps.ver.outputs.version }}-x86_64-linux.tar.gz
            dist/buckyboi_${{ steps.ver.outputs.version }}_amd64.deb
          body: |
            Linux x86_64 assets from `cargo build --release` (**default features**: overlay + gaze).

            **Not included**
            - InsightFace / sherpa / MediaPipe ONNX weights (download yourself with `scripts/download-models.sh`)
            - `--features face,hands,voice` binary (rebuild locally if you want ONNX identity)

            **Optional local feature build**
            ```bash
            cargo build --release --manifest-path rust/Cargo.toml --features face,hands,voice
            ./scripts/download-models.sh
            ```

            Hyprland snippet in the tarball is `contrib/omarchy/hyprland.conf` — merge or `source` it; do not clobber `~/.config/hypr/hyprland.conf`.
